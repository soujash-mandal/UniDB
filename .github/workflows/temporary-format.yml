name: Temporary UniDB formatter

on:
  push:
    branches:
      - soujashmandal/sim-24-queryexecution-dependencies

permissions:
  contents: write

jobs:
  format:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install clang-format
        run: brew install clang-format
      - name: Format C++ files and commit formatting
        run: |
          files=$(find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) -not -path "./build/*")
          for file in $files; do clang-format -i "$file"; done
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $(find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) -not -path "./build/*")
            git commit -m "style: format C++ sources"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
