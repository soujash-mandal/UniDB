name: Docker Persistence

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "DOCKER.md"
      - "scripts/docker-persistence-test.sh"
      - "ConnectionProtocol/**"
      - "container/**"
      - "DatabaseStartup.*"
      - "CMakeLists.txt"
      - "main.cpp"
      - "cli/**"
      - "core/**"
      - "DiskManager/**"
      - "BufferPoolManager/**"
      - "FreePageManager/**"
      - "EvictionPolicy/**"
      - "SpaceMapService/**"
      - "CatalogService/**"
      - "TupleService/**"
      - "RdbService/**"
      - "RdbMetadataService/**"
      - "QueryExecutionService/**"
      - ".github/workflows/docker-persistence.yml"
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "DOCKER.md"
      - "scripts/docker-persistence-test.sh"
      - "ConnectionProtocol/**"
      - "container/**"
      - "DatabaseStartup.*"
      - "CMakeLists.txt"
      - "main.cpp"
      - "cli/**"
      - "core/**"
      - "DiskManager/**"
      - "BufferPoolManager/**"
      - "FreePageManager/**"
      - "EvictionPolicy/**"
      - "SpaceMapService/**"
      - "CatalogService/**"
      - "TupleService/**"
      - "RdbService/**"
      - "RdbMetadataService/**"
      - "QueryExecutionService/**"
      - ".github/workflows/docker-persistence.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  named-volume-persistence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build UniDB image with GitHub Actions cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: unidb:persistence-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: |
            type=gha,scope=unidb-docker-persistence-main
            type=gha,scope=unidb-docker-persistence-${{ github.ref_name }}
          cache-to: type=gha,scope=unidb-docker-persistence-${{ github.ref_name }},mode=max

      - name: Verify named-volume persistence
        env:
          UNIDB_DOCKER_TEST_IMAGE: unidb:persistence-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/docker-persistence-test.sh
