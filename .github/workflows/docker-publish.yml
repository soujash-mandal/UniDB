name: Publish Docker Image

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Docker build, persistence, and mutual TLS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Docker persistence and mutual-TLS integration test
        run: bash scripts/docker-persistence-test.sh

  publish:
    name: Publish versioned multi-platform image
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate version tag and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: soujash/unidb
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push versioned Linux images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  update-latest:
    name: Update latest only for the current stable release
    needs: publish
    runs-on: ubuntu-latest
    # Serialize only the mutable alias. Version tags can publish independently.
    # A newer pending release supersedes an older pending alias update.
    concurrency:
      group: docker-publish-latest
      cancel-in-progress: false
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check whether this is the current latest stable release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data: latest } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.setOutput(
                "is-latest",
                String(latest.tag_name === context.payload.release.tag_name),
              );
            } catch (error) {
              if (error.status === 404) {
                core.setOutput("is-latest", "false");
              } else {
                throw error;
              }
            }

      - name: Point latest to the current stable release
        if: steps.release.outputs.is-latest == 'true'
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag soujash/unidb:latest \
            "soujash/unidb:${VERSION}"
