name: Publish Docker Image

on:
  release:
    types: [published]

permissions:
  contents: read

# Only one release workflow may publish at a time. This prevents an older
# release finishing after a newer one and moving the shared "latest" tag back.
concurrency:
  group: docker-hub-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Docker build, persistence, and mutual TLS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Docker persistence and mutual-TLS integration test
        run: bash scripts/docker-persistence-test.sh

  publish:
    name: Publish multi-platform image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check whether this is the latest stable GitHub release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            if (context.payload.release.prerelease) {
              core.setOutput('is_latest', 'false');
              return;
            }

            let latestTag = null;
            try {
              const { data: latestRelease } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              latestTag = latestRelease.tag_name;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            core.setOutput(
              'is_latest',
              String(latestTag === context.payload.release.tag_name),
            );

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: soujash/unidb
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ steps.release.outputs.is_latest == 'true' }}

      - name: Build and push Linux images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
