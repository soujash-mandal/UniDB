name: Auto Format C++

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: auto-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    name: Format C++ files
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest

    steps:
      - name: Checkout trusted base scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Checkout pull request content without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - name: Install clang-format
        run: brew install clang-format

      # Execute only the formatter script from the trusted base checkout.
      # The pull request checkout is treated as data and never runs its own scripts.
      - name: Format C++ files
        working-directory: pr
        run: ../trusted/scripts/format.sh

      - name: Verify formatting and patch
        working-directory: pr
        run: |
          git diff --check
          files=$(find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) \
            -not -path "./build/*")
          while IFS= read -r file; do
            clang-format --dry-run --Werror "$file"
          done <<EOF
          $files
          EOF

      - name: Commit formatting changes
        if: success()
        working-directory: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- '*.cpp' '*.h' '*.hpp'; then
            echo "No formatting changes needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Apply clang-format"

          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.https://github.com/.extraheader="$auth_header" push origin "HEAD:${BRANCH_NAME}"
