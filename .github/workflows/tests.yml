name: UniDB Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: macos-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ccache googletest

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-tests-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-tests-

      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel 3

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Check service boundaries
        run: python3 architecture/serviceBoundaryTest.py

      - name: Check service graph consistency
        run: python3 architecture/serviceGraphValidationTest.py

      - name: Show compiler cache statistics
        run: ccache --show-stats
