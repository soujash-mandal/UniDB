name: UniDB Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify preinstalled build dependencies
        run: |
          command -v cmake
          command -v ccache
          command -v clang++
          command -v clang-tidy
          test -f /usr/include/gtest/gtest.h
          test -f /usr/include/openssl/ssl.h

      - name: Install build dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y --no-install-recommends libgtest-dev libssl-dev

      - name: Configure
        run: cmake -S . -B build -DUNIDB_ENABLE_STRICT_WARNINGS=ON

      - name: Build
        run: cmake --build build --parallel 3

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Check service boundaries
        run: python3 architecture/serviceBoundaryTest.py

      - name: Check type folder import isolation
        run: python3 architecture/typeFolderImportTest.py

      - name: Check service graph consistency
        run: python3 architecture/serviceGraphValidationTest.py

