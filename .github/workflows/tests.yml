name: UniDB Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y --no-install-recommends ccache libgtest-dev libssl-dev

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}-${{ github.ref }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}-
            ccache-${{ runner.os }}-

      - name: Configure
        run: cmake -S . -B build -DUNIDB_ENABLE_STRICT_WARNINGS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel 3

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Check service boundaries
        run: python3 architecture/serviceBoundaryTest.py

      - name: Check type folder import isolation
        run: python3 architecture/typeFolderImportTest.py

      - name: Check service graph consistency
        run: python3 architecture/serviceGraphValidationTest.py

