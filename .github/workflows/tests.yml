name: UniDB Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify preinstalled build dependencies
        run: |
          command -v cmake
          command -v ccache
          command -v clang++
          command -v clang-tidy
          test -f /usr/include/gtest/gtest.h
          test -f /usr/include/openssl/ssl.h

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-tests-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure
        run: cmake -S . -B build -DUNIDB_ENABLE_STRICT_WARNINGS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel 3

      - name: Save compiler cache
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-tests-${{ github.sha }}

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Check service boundaries
        run: python3 architecture/serviceBoundaryTest.py

      - name: Check type folder import isolation
        run: python3 architecture/typeFolderImportTest.py

      - name: Check service graph consistency
        run: python3 architecture/serviceGraphValidationTest.py

      - name: Show compiler cache statistics
        run: ccache --show-stats
