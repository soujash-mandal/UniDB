name: UniDB Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format 23.1.1
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-format-venv"
          "$RUNNER_TEMP/clang-format-venv/bin/python" -m pip install --disable-pip-version-check clang-format==23.1.1
          echo "$RUNNER_TEMP/clang-format-venv/bin" >> "$GITHUB_PATH"
          clang-format --version

      - name: Check formatting
        run: |
          files=$(find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) \
            -not -path "./build/*")

          for file in $files; do
            clang-format --dry-run --Werror "$file"
          done
