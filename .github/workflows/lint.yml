name: UniDB Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-format-18

      - name: Check formatting
        run: |
          files=$(find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) \
            -not -path "./build/*")

          for file in $files; do
            clang-format-18 --dry-run --Werror "$file"
          done
