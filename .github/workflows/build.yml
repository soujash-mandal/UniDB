name: UniDB Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: macos-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          start=$SECONDS
          brew install ccache googletest
          duration=$((SECONDS - start))
          echo "- Dependency installation: ${duration}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure
        run: |
          start=$SECONDS
          cmake -S . -B build -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          duration=$((SECONDS - start))
          echo "- CMake configure: ${duration}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: |
          start=$SECONDS
          cmake --build build --parallel 3
          duration=$((SECONDS - start))
          echo "- Compile/link: ${duration}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Save compiler cache
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-build-${{ github.sha }}

      - name: Show compiler cache statistics
        run: ccache --show-stats
