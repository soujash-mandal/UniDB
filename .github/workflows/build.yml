name: UniDB Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GoogleTest
        run: brew install googletest

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build
