name: UniDB Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify preinstalled build dependencies
        run: |
          command -v cmake
          command -v ccache
          test -f /usr/include/gtest/gtest.h
          test -f /usr/include/openssl/ssl.h

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure
        run: cmake -S . -B build -DUNIDB_ENABLE_STRICT_WARNINGS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel 3

      - name: Save compiler cache
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-build-${{ github.sha }}

      - name: Show compiler cache statistics
        run: ccache --show-stats

  clang-unused-using:
    name: Clang unused-using check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify preinstalled Clang dependencies
        run: |
          command -v clang
          command -v clang++
          command -v clang-tidy
          command -v cmake
          test -f /usr/include/gtest/gtest.h
          test -f /usr/include/openssl/ssl.h

      - name: Configure with Clang
        run: CC=clang CXX=clang++ cmake -S . -B build-clang

      - name: Check unused using declarations with Clang-Tidy
        run: >-
          clang-tidy
          -p build-clang
          -checks=-*,misc-unused-using-decls
          --warnings-as-errors=misc-unused-using-decls
          QueryExecutionService/actions/ExecuteQueryAction.cpp
