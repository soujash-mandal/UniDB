name: UniDB Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y --no-install-recommends ccache libgtest-dev libssl-dev

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}-
            ccache-${{ runner.os }}-

      - name: Configure
        run: cmake -S . -B build -DUNIDB_ENABLE_STRICT_WARNINGS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel 3

  clang-unused-using:
    name: Clang unused-using check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y --no-install-recommends libgtest-dev libssl-dev

      - name: Configure with Clang
        run: CC=clang CXX=clang++ cmake -S . -B build-clang

      - name: Check unused using declarations with Clang-Tidy
        run: >-
          clang-tidy
          -p build-clang
          -checks=-*,misc-unused-using-decls
          --warnings-as-errors=misc-unused-using-decls
          QueryExecutionService/actions/ExecuteQueryAction.cpp
