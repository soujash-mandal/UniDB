name: UniDB Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            ccache \
            cmake \
            libgtest-dev \
            libssl-dev

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel 3

      - name: Save compiler cache
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-build-${{ github.sha }}

      - name: Show compiler cache statistics
        run: ccache --show-stats

  clang-unused-using:
    name: Clang unused-using check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang \
            clang-tidy \
            cmake \
            libgtest-dev \
            libssl-dev

      - name: Configure with Clang
        run: CC=clang CXX=clang++ cmake -S . -B build-clang

      - name: Check unused using declarations with Clang-Tidy
        run: >-
          clang-tidy
          -p build-clang
          -checks=-*,misc-unused-using-decls
          --warnings-as-errors=misc-unused-using-decls
          QueryExecutionService/actions/ExecuteQueryAction.cpp
